<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão - Simpli Time</title>
    <link rel="icon" type="image/png" href="/img/icon.png?v=3" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8F9FA;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            max-width: 380px;
            text-align: center;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 32px 24px;
        }

        .icon { font-size: 40px; margin-bottom: 12px; }

        h1 { font-size: 18px; margin: 0 0 8px; }

        p { font-size: 14px; color: #6b7280; margin: 0 0 20px; line-height: 1.5; }

        button {
            background: #111111;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h1>Sem conexão com a internet</h1>
        <p>Não conseguimos carregar essa página agora. Verifique sua conexão e tente novamente.</p>
        <button onclick="location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
